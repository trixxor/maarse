[package]
name = "maarse-fw-nrf"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

# Own workspace: the firmware is built for ARM and does not belong to the PC parts.
[workspace]

[features]
default = []
# The button is on P0.09, a pin the chip also uses for NFC: the feature frees it (a one-time
# UICR write at the first start, followed by a reset).
board-wismesh-tag = ["embassy-nrf/nfc-pins-as-gpio"]
board-xiao-nrf52840 = ["sensor"]
# Sensor setups: for boards with free pins.
sensor = ["maarse-fw-common/sensor"]

[dependencies]
cortex-m = { version = "0.7.10", features = ["inline-asm"] }
cortex-m-rt = "0.7.7"
embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread"] }
embassy-futures = "0.1.2"
embassy-nrf = { version = "0.11.0", features = ["nrf52840", "time-driver-rtc1", "gpiote"] }
embassy-sync = "0.8.0"
embassy-time = "0.5.1"
embassy-usb = "0.6.0"
embedded-hal-async = "1.0"
embedded-hal-bus = { version = "0.3.0", features = ["async"] }
embedded-storage = "0.3.2"
heapless = "0.8"
heapless09 = { package = "heapless", version = "0.9" }
lora-phy = "3.0.1"
nrf-mpsl = { version = "0.4", default-features = false, features = ["critical-section-impl", "nrf52840"] }
nrf-sdc = { version = "0.4", default-features = false, features = ["peripheral", "nrf52840"] }
rand_chacha = { version = "0.3", default-features = false }
rand_core = "0.6"
static_cell = "2.1.1"
maarse-core = { path = "../../maarse-core" }
maarse-crypto = { path = "../../maarse-crypto", default-features = false }
# Compact SHA-512/256 rounds: about 25 KB less flash than the unrolled ones.
sha2 = { version = "0.10", default-features = false, features = ["force-soft-compact"] }
maarse-fw-common = { version = "0.1.0", path = "../common" }
trouble-host = { version = "0.8", default-features = false, features = ["derive", "gatt", "peripheral", "default-packet-pool", "security"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
debug = false
panic = "abort"

[profile.dev]
opt-level = "s"
panic = "abort"

# lora-phy with a fix for a panic on garbage from the radio after flashing
# (see firmware/vendor/lora-phy/src/sx126x/mod.rs, "Må:rse patch").
[patch.crates-io]
lora-phy = { path = "../vendor/lora-phy" }
# trouble-host with its packet pool starting as all zeros: otherwise the whole 4 KB pool
# is stored in flash (see src/packet_pool.rs there, "Må:rse patch").
trouble-host = { path = "../vendor/trouble-host" }
