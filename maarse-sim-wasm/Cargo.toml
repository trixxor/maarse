[package]
name = "maarse-sim-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
maarse-core = { version = "0.1.0", path = "../maarse-core" }
maarse-crypto = { version = "0.1.0", path = "../maarse-crypto" }
maarse-sim = { version = "0.1.0", path = "../maarse-sim" }
rand = { version = "0.8", default-features = false, features = ["small_rng"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
heapless = "0.8"

# rand (through maarse-sim) pulls getrandom; on wasm32-unknown-unknown it needs a
# backend. The engine always seeds its RNG, so a backend that fails is enough.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["custom"] }
