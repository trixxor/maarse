name: Build and test

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test
        run: cargo test --workspace
      - name: Build maarse-host
        run: cargo build --release -p maarse-host
      - name: Denmark simulator (presets with expected results)
        if: matrix.os == 'ubuntu-latest'
        run: |
          rustup target add wasm32-unknown-unknown
          python3 tools/build_denmark_sim.py
          node tools/denmark_sim_test.mjs
          node tools/phone_parity_test.mjs
          node tools/terrain_test.mjs
          node tools/ui_features_test.mjs
      - name: Upload (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: maarse-host-linux
          path: target/release/maarse-host
      - name: Upload (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: maarse-host-windows
          path: target/release/maarse-host.exe

  firmware-nrf:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        board: [wismesh-tag, xiao-nrf52840]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf
      - name: libclang and ARM C headers for bindgen (nrf-sdc-sys)
        # On Ubuntu 26.04 libnewlib-arm-none-eabi pulls in a full ARM gcc and a
        # 487 MB libstdc++, which made this step hang. bindgen only needs the
        # newlib C headers, so unpack those two packages without dependencies.
        timeout-minutes: 15
        run: |
          export DEBIAN_FRONTEND=noninteractive
          for i in 1 2 3; do
            sudo timeout 300 apt-get update -q -o Acquire::Retries=3 &&
            sudo timeout 300 apt-get install -y -q --no-install-recommends -o Acquire::Retries=3 libclang-dev clang &&
            (cd /tmp && timeout 300 apt-get download -o Acquire::Retries=3 libnewlib-arm-none-eabi libnewlib-dev) && break
            echo "apt attempt $i failed, retrying"; sleep 15
            [ "$i" = 3 ] && exit 1
          done
          mkdir -p "$RUNNER_TEMP/newlib"
          for d in /tmp/libnewlib*.deb; do dpkg -x "$d" "$RUNNER_TEMP/newlib"; done
          # The include folder has moved between Ubuntu releases: find it.
          # Ubuntu 24.04: /usr/lib/arm-none-eabi/include; 26.04: /usr/include/newlib.
          inc=$(dirname "$(find "$RUNNER_TEMP/newlib" -name stdint.h \( -path '*arm-none-eabi*' -o -path '*newlib*' \) | grep -v '/machine/\|/sys/\|/ssp/' | head -1)")
          echo "newlib headers: $inc"; test -f "$inc/string.h"
          echo "BINDGEN_EXTRA_CLANG_ARGS=-I$inc" >> "$GITHUB_ENV"
      - run: ./scripts/build-firmware.sh ${{ matrix.board }}
      - uses: actions/upload-artifact@v4
        with:
          name: maarse-${{ matrix.board }}
          path: dist/maarse-${{ matrix.board }}.uf2

  firmware-esp:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        board: [heltec-v4, xiao-esp32s3]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install espflash espup --locked && espup install --targets esp32s3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: ./scripts/build-firmware.sh ${{ matrix.board }}
      - uses: actions/upload-artifact@v4
        with:
          name: maarse-${{ matrix.board }}
          path: dist/maarse-${{ matrix.board }}.bin
