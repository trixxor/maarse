[package]
name = "maarse-fw-esp"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Må:rse firmware for ESP32-S3 + SX1262 (Heltec V4, XIAO ESP32-S3 + Wio-SX1262)"

# Own workspace: built with Espressif's Xtensa toolchain (espup).
[workspace]

[features]
default = ["ble", "wifi"]
# Choose exactly one board.
board-heltec-v4 = ["esp32s3", "display"]
board-xiao-esp32s3 = ["esp32s3"]
# Bluetooth (Nordic UART) to the phone app. On by default.
ble = ["esp-radio/ble", "dep:bt-hci", "dep:trouble-host"]
# Wi-Fi backbone. On by default together with `ble`: only one of them runs
# at a time (the saved mode decides; hold the button 3 s or use `SetWifi` to
# switch), so the heap only has to hold one driver and no `coex` is needed.
# `--no-default-features --features board-heltec-v4,ble` (or `,wifi`) builds
# a firmware with just one of them and more free RAM.
wifi = ["esp-radio/wifi", "dep:embassy-net", "dep:smoltcp"]
# Wi-Fi hotspot for phones (hotspot.rs). Off by default: its statics (about 8 KB) come out of the main stack, and the Wi-Fi driver
# needs nearly all of that when it starts (about 51 KB of 57 KB; 6 KB are left with the hotspot, 14 KB without). Build with
# `scripts/build-firmware.ps1 heltec-v4 -Hotspot`.
hotspot = ["wifi"]
# Only for checking the code with the ordinary Rust toolchain
# (RISC-V, ESP32-C6); does not run on any real board.
check-esp32c6 = ["esp-hal/esp32c6", "esp-rtos/esp32c6", "esp-radio/esp32c6", "esp-storage/esp32c6", "esp-bootloader-esp-idf/esp32c6", "esp-println/esp32c6"]
esp32s3 = ["esp-hal/esp32s3", "esp-rtos/esp32s3", "esp-radio/esp32s3", "esp-storage/esp32s3", "esp-bootloader-esp-idf/esp32s3", "esp-println/esp32s3"]
display = ["dep:ssd1306", "dep:embedded-graphics"]

[dependencies]
embassy-executor = { version = "0.10.0" }
embassy-futures = "0.1.2"
embassy-sync = "0.8.0"
embassy-time = "0.5.1"
embedded-graphics = { version = "0.8.2", optional = true }
embedded-hal-bus = { version = "0.3.0", features = ["async"] }
embedded-io-async = "0.7"
esp-alloc = "=0.11.0"
embedded-storage = "0.3.2"
esp-bootloader-esp-idf = { version = "0.6.0" }
esp-hal = { version = "1.2.2", features = ["unstable"] }
# Bluetooth: esp-radio (BLE controller, HCI) + TrouBLE as host, as on nRF.
# Wi-Fi backbone: esp-radio's Wi-Fi driver with embassy-net (TCP, DHCP, DNS).
# Wi-Fi and Bluetooth are never on at the same time (Bluetooth is not started
# when Wi-Fi is enabled), so no `coex`: it would cost RAM the board lacks.
esp-radio = { version = "=1.0.0-beta.1", features = ["unstable", "esp-alloc"] }
# Crash logging over USB: the panic handler prints the reason (esp-hal turns
# hardware exceptions into panics too). Read with `espflash monitor`.
esp-println = { version = "0.18", default-features = false, features = ["jtag-serial", "critical-section"] }
embassy-net = { version = "0.9.1", optional = true, features = ["tcp", "udp", "dhcpv4", "dns", "proto-ipv4", "medium-ethernet"] }
# Only to switch on automatic ping replies in the TCP/IP stack embassy-net uses.
smoltcp = { version = "0.13.1", optional = true, default-features = false, features = ["auto-icmp-echo-reply"] }
esp-rtos = { version = "0.4.0", features = ["embassy", "esp-radio", "esp-alloc"] }
esp-storage = { version = "0.10.0", features = ["embedded-storage"] }
heapless = "0.8"
heapless09 = { package = "heapless", version = "0.9" }
bt-hci = { version = "0.10", optional = true }
trouble-host = { version = "0.8", optional = true, default-features = false, features = ["derive", "gatt", "peripheral", "default-packet-pool", "security"] }
lora-phy = "3.0.1"
rand_chacha = { version = "0.3", default-features = false }
rand_core = "0.6"
# Compact SHA-512/256 rounds, as on nRF: the unrolled SHA-512 function alone (45 KB) did not
# fit in the 32 KB instruction cache.
sha2 = { version = "0.10", default-features = false, features = ["force-soft-compact"] }
ssd1306 = { version = "0.10.0", optional = true }
static_cell = "2.1.1"
maarse-core = { path = "../../maarse-core" }
maarse-crypto = { path = "../../maarse-crypto" }
maarse-fw-common = { path = "../common" }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
debug = false
panic = "abort"

[profile.dev]
opt-level = "s"
panic = "abort"

# lora-phy with a fix for a panic on garbage from the radio after flashing
# (see firmware/vendor/lora-phy/src/sx126x/mod.rs, "Må:rse patch").
[patch.crates-io]
lora-phy = { path = "../vendor/lora-phy" }
