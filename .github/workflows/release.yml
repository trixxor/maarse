name: Release firmware

# Push a tag like v0.6.0 (or start it by hand under Actions) to build the
# firmware for every board, attach it to a GitHub Release and publish the web
# flasher with the same files on GitHub Pages.
#
# Optional signing of the over-the-air packages: repository secret
# MAARSE_SIGN_KEY_B64 (the key file from `maarse-sign keygen`, base64) and
# repository variable MAARSE_RELEASE_PUBKEY (64 hex). Without them the release
# has no -ota files; USB flashing does not need them.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version without v (e.g. 0.6.0)"
        required: true
      windows_only:
        description: "Only rebuild the Windows files for an existing release (skips firmware and Pages)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  MAARSE_FW_VERSION: ${{ inputs.version || github.ref_name }}
  MAARSE_RELEASE_PUBKEY: ${{ vars.MAARSE_RELEASE_PUBKEY }}

jobs:
  firmware:
    if: ${{ !inputs.windows_only }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { board: wismesh-tag, kind: nrf }
          - { board: xiao-nrf52840, kind: nrf }
          - { board: heltec-v4, kind: esp }
          - { board: xiao-esp32s3, kind: esp }
          # MeshCore gateway for the Må:rse backbone (firmware/meshcore-gateway).
          - { board: heltec-v4-gateway, kind: gateway, env: heltec_v4_kiss_backbone }
          - { board: heltec-v4-tft-gateway, kind: gateway, env: heltec_v4_kiss_backbone_tft }
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Version without the v
        run: echo "MAARSE_FW_VERSION=${MAARSE_FW_VERSION#v}" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        if: matrix.kind == 'nrf'
        with:
          targets: thumbv7em-none-eabihf
      - name: libclang and ARM C headers for bindgen (nrf-sdc-sys)
        if: matrix.kind != 'gateway'
        # On Ubuntu 26.04 libnewlib-arm-none-eabi pulls in a full ARM gcc and a
        # 487 MB libstdc++, which made this step hang. bindgen only needs the
        # newlib C headers, so unpack those two packages without dependencies.
        timeout-minutes: 15
        run: |
          export DEBIAN_FRONTEND=noninteractive
          for i in 1 2 3; do
            sudo timeout 300 apt-get update -q -o Acquire::Retries=3 &&
            sudo timeout 300 apt-get install -y -q --no-install-recommends -o Acquire::Retries=3 libclang-dev clang &&
            (cd /tmp && timeout 300 apt-get download -o Acquire::Retries=3 libnewlib-arm-none-eabi libnewlib-dev) && break
            echo "apt attempt $i failed, retrying"; sleep 15
            [ "$i" = 3 ] && exit 1
          done
          mkdir -p "$RUNNER_TEMP/newlib"
          for d in /tmp/libnewlib*.deb; do dpkg -x "$d" "$RUNNER_TEMP/newlib"; done
          # The include folder has moved between Ubuntu releases: find it.
          # Ubuntu 24.04: /usr/lib/arm-none-eabi/include; 26.04: /usr/include/newlib.
          inc=$(dirname "$(find "$RUNNER_TEMP/newlib" -name stdint.h \( -path '*arm-none-eabi*' -o -path '*newlib*' \) | grep -v '/machine/\|/sys/\|/ssp/' | head -1)")
          echo "newlib headers: $inc"; test -f "$inc/string.h"
          echo "BINDGEN_EXTRA_CLANG_ARGS=-I$inc" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        if: matrix.kind == 'esp'
      - if: matrix.kind == 'esp'
        run: cargo install espflash espup --locked && espup install --targets esp32s3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Signing key
        if: matrix.kind != 'gateway'
        env:
          KEY_B64: ${{ secrets.MAARSE_SIGN_KEY_B64 }}
        run: |
          if [ -n "$KEY_B64" ]; then
            umask 077
            printf '%s' "$KEY_B64" | base64 -d > "$RUNNER_TEMP/sign.key"
            cargo run --locked -q -p maarse-uf2 --bin maarse-sign -- check-release-key \
              --pubkey "$MAARSE_RELEASE_PUBKEY" --key "$RUNNER_TEMP/sign.key"
            echo "MAARSE_SIGN_KEY=$RUNNER_TEMP/sign.key" >> "$GITHUB_ENV"
          elif [ -n "$MAARSE_RELEASE_PUBKEY" ]; then
            cargo run --locked -q -p maarse-uf2 --bin maarse-sign -- check-release-key \
              --pubkey "$MAARSE_RELEASE_PUBKEY"
          fi
      - run: ./scripts/build-firmware.sh ${{ matrix.board }}
        if: matrix.kind != 'gateway'
      - uses: actions/setup-python@v5
        if: matrix.kind == 'gateway'
        with:
          python-version: "3.12"
      - name: Gateway firmware (MeshCore with the backbone link, merged image)
        if: matrix.kind == 'gateway'
        run: |
          pip install --quiet "platformio==6.2.0" "esptool==4.8.1"
          firmware/meshcore-gateway/build.sh "${{ matrix.env }}" "dist/maarse-${{ matrix.board }}.bin"
      - name: Trim the merged ESP image (padded with 0xFF to the full flash)
        if: matrix.kind == 'esp'
        run: |
          python3 - "dist/maarse-${{ matrix.board }}.bin" <<'EOF'
          import sys
          p = sys.argv[1]; d = open(p, "rb").read()
          end = len(d.rstrip(b"\xff")); end = min(len(d), (end + 4095) // 4096 * 4096)
          open(p, "wb").write(d[:end]); print(p, len(d), "->", end)
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: fw-${{ matrix.board }}
          path: |
            dist/maarse-${{ matrix.board }}.uf2
            dist/maarse-${{ matrix.board }}.bin
            dist/maarse-${{ matrix.board }}-ota.*
            dist/meshcore-license.txt
          if-no-files-found: ignore

  publish:
    permissions:
      contents: write
      pages: write
      id-token: write
    if: ${{ !inputs.windows_only }}
    needs: firmware
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          path: fw
          pattern: fw-*
          merge-multiple: true
      - name: Checksums and site
        env:
          PAGES_CNAME: ${{ vars.PAGES_CNAME }}
        run: |
          V="${MAARSE_FW_VERSION#v}"
          (cd fw && sha256sum * > SHA256SUMS && ls -la)
          mkdir -p site/firmware
          cp maarse-client/flash.html site/index.html
          cp maarse-client/icon.svg site/
          cp docs/site/*.html site/   # docs pages, e.g. pages.html (how maarse:// pages work)
          cp -r docs/simulator site/simulator   # the network simulator, in the browser (no server needed)
          cp -r docs/denmark site/denmark       # the Denmark simulator (the real routing code as WebAssembly)
          cp maarse-client/index.html site/denmark/client.html   # its phones run the current web client
          cp fw/* site/firmware/
          cat > site/firmware/index.json <<EOF
          {"version":"$V","commit":"$GITHUB_SHA","built":"$(date -u +%Y-%m-%dT%H:%M:%SZ)"}
          EOF
          [ -n "$PAGES_CNAME" ] && printf '%s\n' "$PAGES_CNAME" > site/CNAME || true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', inputs.version) }}
          name: Må:rse ${{ env.MAARSE_FW_VERSION }}
          files: fw/*
          generate_release_notes: true
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  # The flasher site. A separate job, so a hiccup at GitHub Pages never blocks the Windows files.
  pages:
    if: ${{ !inputs.windows_only }}
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - id: pages
        uses: actions/deploy-pages@v4

  # The Windows app: maarse-service.exe (service, runs the host, installs signed updates), maarse.exe (tray app)
  # and maarse-host.exe. The package, a checksum list and its signature are attached to the same release;
  # the service installs an update only if the signature matches MAARSE_RELEASE_PUBKEY (built into it).
  windows:
    needs: publish
    if: ${{ !cancelled() && (needs.publish.result == 'success' || needs.publish.result == 'skipped') }}
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Version without the v
        shell: bash
        run: echo "MAARSE_VERSION=${MAARSE_FW_VERSION#v}" >> "$GITHUB_ENV"
      - name: Release key present
        shell: bash
        env:
          KEY_B64: ${{ secrets.MAARSE_SIGN_KEY_B64 }}
        run: |
          [ -n "$KEY_B64" ] && [ -n "$MAARSE_RELEASE_PUBKEY" ] || { echo "MAARSE_SIGN_KEY_B64 and MAARSE_RELEASE_PUBKEY are needed: the Windows update must be signed"; exit 1; }
      - name: Build
        run: cargo build --release --locked -p maarse-host -p maarse-desktop -p maarse-service
      - name: Package
        shell: bash
        run: |
          mkdir -p out/pkg out/sign
          cp target/release/maarse.exe target/release/maarse-host.exe target/release/maarse-service.exe out/pkg/
          (cd out/pkg && 7z a -tzip ../maarse-windows-x64.zip maarse.exe maarse-host.exe maarse-service.exe)
      - name: Installer
        shell: pwsh
        run: |
          iscc "/DAppVersion=$env:MAARSE_VERSION" "/DSourceDir=$PWD\out\pkg" "/O$PWD\out" packaging\windows\maarse.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Sign
        shell: bash
        env:
          KEY_B64: ${{ secrets.MAARSE_SIGN_KEY_B64 }}
        run: |
          # sign-release signs every file in a folder: the list is named SHA256SUMS there, SHA256SUMS-windows on the release.
          cp out/maarse-windows-x64.zip out/maarse-setup-x64.exe out/sign/
          umask 077
          printf '%s' "$KEY_B64" | base64 -d > "$RUNNER_TEMP/sign.key"
          cargo run --locked -q -p maarse-uf2 --bin maarse-sign -- sign-release --key "$RUNNER_TEMP/sign.key" out/sign
          cargo run --locked -q -p maarse-uf2 --bin maarse-sign -- verify-release --pubkey "$MAARSE_RELEASE_PUBKEY" out/sign
          cp out/sign/SHA256SUMS out/SHA256SUMS-windows
          cp out/sign/SHA256SUMS.sig out/SHA256SUMS-windows.sig
          rm -f "$RUNNER_TEMP/sign.key"
      - name: Attach to the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', inputs.version) }}"
          gh release upload "$TAG" out/maarse-windows-x64.zip out/maarse-setup-x64.exe out/SHA256SUMS-windows out/SHA256SUMS-windows.sig --clobber --repo "$GITHUB_REPOSITORY"
