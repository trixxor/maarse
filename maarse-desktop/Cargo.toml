[package]
name = "maarse-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Windows tray app for Må:rse: splash screen, update notice and tray icon; talks to the Maarse service"

[[bin]]
name = "maarse"
path = "src/main.rs"

[dependencies]
maarse-service = { version = "0.1.0", path = "../maarse-service" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
