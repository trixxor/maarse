[package]
name = "maarse-android"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "JNI bridge: runs maarse-host inside the Android app"

[lib]
name = "maarse_android"
crate-type = ["cdylib"]

[dependencies]
# No TUN on Android yet: it needs the VpnService file descriptor.
maarse-host = { path = "../maarse-host", default-features = false }
maarse-voice = { path = "../maarse-voice" }
jni = "0.21"
libc = "0.2"
