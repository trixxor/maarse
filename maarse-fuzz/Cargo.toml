[package]
name = "maarse-fuzz"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# Portabel fuzzing (virker også på Windows/MSVC, hvor cargo-fuzz/libFuzzer
# ikke er pålidelig): deterministiske tilfældige og muterede input mod alle
# dekodere, der læser bytes udefra. Se README ("Fuzzing").

[dependencies]

[dev-dependencies]
maarse-core = { version = "0.1.0", path = "../maarse-core" }
maarse-crypto = { version = "0.1.0", path = "../maarse-crypto" }
heapless = "0.8"
rand_core = { version = "0.6", features = ["getrandom"] }
