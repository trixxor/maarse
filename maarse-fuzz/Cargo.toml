[package]
name = "maarse-fuzz"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# Portable fuzzing (also works on Windows/MSVC, where cargo-fuzz/libFuzzer
# is not reliable): deterministic random and mutated inputs against all
# decoders that read bytes from outside. See README ("Fuzzing").

[dependencies]

[dev-dependencies]
maarse-core = { version = "0.1.0", path = "../maarse-core" }
maarse-crypto = { version = "0.1.0", path = "../maarse-crypto" }
heapless = "0.8"
rand_core = { version = "0.6", features = ["getrandom"] }
