[maarse_gateway]
lib_ldf_mode = deep+
extra_scripts =
  ${esp32_base.extra_scripts}
  pre:../firmware/kiss_modem_wifi/platformio_sources.py
build_unflags =
  -DARDUINO_USB_MODE=0
build_flags =
  -DARDUINO_USB_MODE=1
  -I examples/kiss_modem
  -D KISS_BACKBONE
  -D WIFI_HOSTNAME='"maarse-gate"'
build_src_filter =
  +<../examples/kiss_modem/KissModem.cpp>
  +<../../firmware/kiss_modem_wifi/>

[env:heltec_v4_kiss_backbone]
extends = heltec_v4_oled, maarse_gateway
build_flags =
  ${heltec_v4_oled.build_flags}
  ${maarse_gateway.build_flags}
  -D DISPLAY_CLASS=SSD1306Display
build_src_filter =
  ${heltec_v4_oled.build_src_filter}
  ${maarse_gateway.build_src_filter}
  +<helpers/ui/SSD1306Display.cpp>

[env:heltec_v4_kiss_backbone_tft]
extends = heltec_v4_tft, maarse_gateway
build_flags =
  ${heltec_v4_tft.build_flags}
  ${maarse_gateway.build_flags}
  -D DISPLAY_CLASS=ST7789LCDDisplay
build_src_filter =
  ${heltec_v4_tft.build_src_filter}
  ${maarse_gateway.build_src_filter}
  +<helpers/ui/ST7789LCDDisplay.cpp>
