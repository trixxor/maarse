<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="14">
  <rect width="900" height="380" rx="14" fill="#ffffff"/>
  <text x="450" y="34" text-anchor="middle" font-weight="700" font-size="17" fill="#1b1f24">One network: LoRa where there is no coverage, TCP where there is</text>
  <!-- internet cloud -->
  <rect x="290" y="62" width="320" height="86" rx="43" fill="#eaf2fd" stroke="#1f6fd1" stroke-width="2"/>
  <text x="450" y="98" text-anchor="middle" font-weight="700" fill="#1f6fd1">TCP backbone + DHT</text>
  <text x="450" y="120" text-anchor="middle" fill="#3b5f8a" font-size="13">find anyone by address, no central server</text>
  <!-- left island -->
  <rect x="30" y="190" width="370" height="160" rx="16" fill="#eef5ea" stroke="#b9d3ad"/>
  <text x="50" y="214" font-weight="700" fill="#2f5d3a">LoRa: home area</text>
  <rect x="300" y="232" width="74" height="40" rx="8" fill="#1b1f24"/><text x="337" y="257" text-anchor="middle" fill="#fff" font-size="13">host</text>
  <path d="M220,280 l11,19 h-22z" fill="#1b1f24"/><path d="M130,250 l11,19 h-22z" fill="#1b1f24"/>
  <circle cx="70" cy="300" r="8" fill="#5d6673"/><circle cx="150" cy="320" r="8" fill="#5d6673"/>
  <g stroke="#5d6673" stroke-dasharray="4 4" stroke-width="1.6"><line x1="70" y1="300" x2="130" y2="262"/><line x1="130" y1="262" x2="220" y2="290"/><line x1="220" y1="290" x2="300" y2="256"/><line x1="150" y1="320" x2="220" y2="292"/></g>
  <text x="60" y="340" fill="#5d6673" font-size="12">handheld nodes</text><text x="160" y="248" fill="#5d6673" font-size="12">repeaters</text>
  <!-- right island -->
  <rect x="500" y="190" width="370" height="160" rx="16" fill="#eef5ea" stroke="#b9d3ad"/>
  <text x="520" y="214" font-weight="700" fill="#2f5d3a">LoRa: a hilltop 200 km away</text>
  <rect x="526" y="232" width="96" height="40" rx="8" fill="#1b1f24"/><text x="574" y="250" text-anchor="middle" fill="#fff" font-size="12">ESP32 node</text><text x="574" y="264" text-anchor="middle" fill="#fff" font-size="11">on a Wi-Fi hotspot</text>
  <path d="M700,270 l11,19 h-22z" fill="#1b1f24"/><circle cx="800" cy="300" r="8" fill="#5d6673"/><circle cx="760" cy="325" r="8" fill="#5d6673"/>
  <g stroke="#5d6673" stroke-dasharray="4 4" stroke-width="1.6"><line x1="622" y1="256" x2="700" y2="282"/><line x1="700" y1="282" x2="800" y2="300"/><line x1="700" y1="284" x2="760" y2="325"/></g>
  <!-- links to cloud -->
  <g stroke="#1f6fd1" stroke-width="3" fill="none"><path d="M337,232 C337,190 360,170 380,145"/><path d="M574,232 C574,190 540,170 520,145"/></g>
  <!-- side items -->
  <rect x="680" y="70" width="190" height="34" rx="8" fill="#fff6ea" stroke="#c9822b"/><text x="775" y="92" text-anchor="middle" fill="#8a5a1d" font-size="13">MeshCore gateway</text>
  <rect x="680" y="114" width="190" height="34" rx="8" fill="#f3eefb" stroke="#7a4fb5"/><text x="775" y="136" text-anchor="middle" fill="#5a3a88" font-size="13">phone over VPN · MQTT</text>
  <g stroke="#9aa3ad" stroke-width="2"><line x1="610" y1="96" x2="680" y2="87"/><line x1="606" y1="120" x2="680" y2="131"/></g>
  <rect x="30" y="70" width="230" height="78" rx="8" fill="#f6f7f9" stroke="#dde1e6"/>
  <text x="44" y="94" fill="#1b1f24" font-size="13">Same address everywhere:</text>
  <text x="44" y="114" fill="#1b1f24" font-size="13" font-family="ui-monospace, Consolas, monospace">3eb445ec4cad3c49…</text>
  <text x="44" y="134" fill="#5d6673" font-size="12">16-byte hash of your public key</text>
</svg>
