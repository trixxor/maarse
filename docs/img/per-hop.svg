<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="14">
<style>
  .bg { fill: #ffffff; } .ink { fill: #17202a; } .muted { fill: #5b6673; } .rep { fill: #17202a; } .wire { stroke: #c9d0d8; }
  .bad { fill: #c0392b; } .ok { fill: #2e8b57; } .mc { fill: #d0842a; } .ma { fill: #1f6fd1; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #171c22; } .ink { fill: #e7ebef; } .muted { fill: #9ba6b2; } .rep { fill: #e7ebef; } .wire { stroke: #3a434d; }
    .bad { fill: #ef6b5e; } .ok { fill: #5cc489; } .mc { fill: #eaa65a; } .ma { fill: #5ea6ff; }
  }
  /* 9 s loop. Top: lost at hop 3, back to the start. Bottom: lost at hop 3, resent on hop 3. */
  .p1 { offset-path: path('M150,105 L330,105 L510,105 L600,105'); animation: p1 9s linear infinite; }
  @keyframes p1 { 0% { offset-distance: 0%; opacity: 1; } 38% { offset-distance: 100%; opacity: 1; } 40%, 100% { offset-distance: 100%; opacity: 0; } }
  .p1b { offset-path: path('M150,105 L330,105 L510,105 L690,105 L780,105'); animation: p1b 9s linear infinite; opacity: 0; }
  @keyframes p1b { 0%, 52% { offset-distance: 0%; opacity: 0; } 53% { opacity: 1; } 99% { offset-distance: 100%; opacity: 1; } 100% { offset-distance: 100%; opacity: 0; } }
  .x1 { opacity: 0; animation: x1 9s infinite; } @keyframes x1 { 0%, 38% { opacity: 0; } 40%, 52% { opacity: 1; } 54%, 100% { opacity: 0; } }
  .s1 { opacity: 0; animation: s1 9s infinite; } @keyframes s1 { 0%, 42% { opacity: 0; } 44%, 56% { opacity: 1; } 58%, 100% { opacity: 0; } }
  .p2 { offset-path: path('M150,225 L330,225 L510,225 L600,225'); animation: p2 9s linear infinite; }
  @keyframes p2 { 0% { offset-distance: 0%; opacity: 1; } 38% { offset-distance: 100%; opacity: 1; } 40%, 100% { offset-distance: 100%; opacity: 0; } }
  .p2b { offset-path: path('M510,225 L690,225 L870,225'); animation: p2b 9s linear infinite; opacity: 0; }
  @keyframes p2b { 0%, 44% { offset-distance: 0%; opacity: 0; } 45% { opacity: 1; } 75% { offset-distance: 100%; opacity: 1; } 77%, 100% { offset-distance: 100%; opacity: 0; } }
  .x2 { opacity: 0; animation: x2 9s infinite; } @keyframes x2 { 0%, 38% { opacity: 0; } 40%, 46% { opacity: 1; } 48%, 100% { opacity: 0; } }
  .d2 { opacity: 0; animation: d2 9s infinite; } @keyframes d2 { 0%, 75% { opacity: 0; } 77%, 97% { opacity: 1; } 99%, 100% { opacity: 0; } }
</style>
<rect class="bg" width="900" height="300" rx="16"/>
<text class="ink" x="450" y="32" text-anchor="middle" font-weight="700" font-size="18">One packet is lost on hop 3 of 4</text>

<text class="mc" x="20" y="100" font-weight="700">MeshCore,</text><text class="mc" x="20" y="118" font-weight="700">Reticulum</text>
<line class="wire" x1="150" y1="105" x2="870" y2="105" stroke-width="3"/>
<g class="rep"><circle cx="150" cy="105" r="9"/><path d="M330,96 l10,17 h-20z"/><path d="M510,96 l10,17 h-20z"/><path d="M690,96 l10,17 h-20z"/><circle cx="870" cy="105" r="9"/></g>
<circle class="mc p1" r="8"/><circle class="mc p1b" r="8"/>
<text class="bad x1" x="600" y="92" text-anchor="middle" font-weight="700" font-size="20">✗</text>
<text class="muted s1" x="600" y="140" text-anchor="middle">no acknowledgement → start over from the sender</text>

<text class="ma" x="20" y="222" font-weight="700">Må:rse</text>
<line class="wire" x1="150" y1="225" x2="870" y2="225" stroke-width="3"/>
<g class="rep"><circle cx="150" cy="225" r="9"/><path d="M330,216 l10,17 h-20z"/><path d="M510,216 l10,17 h-20z"/><path d="M690,216 l10,17 h-20z"/><circle cx="870" cy="225" r="9"/></g>
<circle class="ma p2" r="8"/><circle class="ma p2b" r="8"/>
<text class="bad x2" x="600" y="212" text-anchor="middle" font-weight="700" font-size="20">✗</text>
<text class="muted" x="510" y="262" text-anchor="middle" font-size="13">no ✓ from the next hop → resend from here</text>
<text class="ok d2" x="870" y="200" text-anchor="middle" font-weight="700">delivered ✓</text>
<text class="muted" x="450" y="290" text-anchor="middle" font-size="13">On a long route, resending one hop instead of the whole route is what keeps delivery high.</text>
</svg>
