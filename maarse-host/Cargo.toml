[package]
name = "maarse-host"
version.workspace = true
edition.workspace = true
license.workspace = true

# Two programs from the same code: the host, and maarse-server (a host
# without radio or web client that keeps the open backbone together; it
# picks its defaults from its own name, see `server_mode` in main.rs).
# The same code as a library, for the Android app (see maarse-android).
[lib]
name = "maarse_host"
path = "src/lib.rs"
test = false
doctest = false

[[bin]]
name = "maarse-host"
path = "src/main.rs"

[[bin]]
name = "maarse-server"
path = "src/server.rs"
test = false

[dependencies]
# TCP keepalive on backbone links, so a peer that vanished (a node on a phone
# hotspot, a restart) is noticed and its link closed.
socket2 = { version = "0.6", features = ["all"] }
rand_core = { version = "0.6", features = ["getrandom"] }
heapless = "0.8"
serialport = { version = "4", default-features = false }
sha2 = "0.10"
chacha20poly1305 = "0.10"
miniz_oxide = "0.8"
maarse-core = { version = "0.1.0", path = "../maarse-core" }
maarse-crypto = { version = "0.1.0", path = "../maarse-crypto" }
tungstenite = "0.24"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
tun-rs = { version = "2.8", optional = true }

[features]
default = ["tun"]
# IP-tunnel (--tun): TUN-adapter via Wintun (Windows) eller /dev/net/tun (Linux).
tun = ["dep:tun-rs"]

[dev-dependencies]
maarse-fuzz = { version = "0.1.0", path = "../maarse-fuzz" }
